<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbon Footprint Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --green: #16845b; --line: #b8dce0; --soft: #f7fbfa; }
    body { background:#fff; color:#292929; font-family: Georgia, "Times New Roman", serif; font-size:14px; }
    .page { max-width: 980px; margin: 24px auto; padding: 0 18px; }
    .page-title { text-align:center; margin-bottom:16px; }
    .page-title h1 { display:inline-block; font-size:clamp(1.35rem,3vw,2rem); font-weight:bold; border:2px solid #aeb6c0; padding:2px 9px; margin:0; }
    .nav-frame { border:2px solid var(--line); padding:3px; margin-bottom:26px; }
    .nav-tabs { border-bottom:0; gap:2px; }
    .nav-tabs .nav-link { font-size:12px; padding:5px 10px; border:0; border-radius:0; color:#47618a; }
    .nav-tabs .nav-link.active { color:#333; background:#f4f5f5; border-bottom:2px solid var(--green); }
    .nav-home { margin-left:auto; align-self:center; background:var(--green); color:#fff; text-decoration:none; padding:5px 12px; font-size:12px; }
    .tab-label { width:max-content; margin:-36px auto 8px; position:relative; background:#fff; border:1px solid #b9c9d1; border-radius:10px; padding:1px 9px; font-size:12px; }
    .calculator { max-width:620px; margin:0 auto; border:2px solid var(--line); padding:5px; background:#fff; }
    .card-heading { background:var(--green); color:white; text-align:center; padding:7px; margin-bottom:8px; font-size:14px; }
    .form-panel { border:1px solid #e2b8a6; padding:12px 10px; min-height:154px; }
    .form-label { margin:0; }
    .form-control, .form-select { font-family:Arial,sans-serif; font-size:13px; min-height:31px; }
    .footer { border:1px solid #e2b8a6; padding:7px; margin-top:8px; display:flex; justify-content:center; gap:8px; }
    .btn-green { background:var(--green); color:white; border:1px solid #0e704c; border-radius:3px; padding:4px 14px; font-size:13px; }
    .btn-green:hover, .btn-green:focus { background:#0c6c49; color:#fff; }
    .step { display:none; } .step.active { display:block; }
    .hint { color:#6b7773; font:12px Arial,sans-serif; text-align:center; margin-top:16px; }
    .result-box { background:#edf8f1; border:1px solid #9acbb0; padding:14px; border-radius:4px; }
    @media (max-width:600px) { .page {margin-top:16px;padding:0 10px}.nav-tabs .nav-link{padding:5px 6px;font-size:11px}.nav-home{padding:5px 8px}.form-panel{padding:10px 7px} }
  </style>
</head>
<body>
  <main class="container-fluid page">
    <header class="page-title"><h1>Carbon Footprint Calculator</h1></header>
    <nav class="nav-frame" aria-label="Calculator steps">
      <div class="nav nav-tabs align-items-center" id="stepTabs">
        <button class="nav-link active" type="button" data-step="0">General</button>
        <button class="nav-link" type="button" data-step="1">Home</button>
        <button class="nav-link" type="button" data-step="2">Travel</button>
        <button class="nav-link" type="button" data-step="3">Food</button>
        <button class="nav-link" type="button" data-step="4">Electronic usage</button>
        <button class="nav-link" type="button" data-step="5">Shopping</button>
        <button class="nav-link" type="button" data-step="6">Result</button>
        <a class="nav-home" href="#top" id="homeLink">Home</a>
      </div>
    </nav>
    <div class="tab-label">Card</div>
    <section class="calculator" aria-label="Carbon footprint form">
      <div class="card-heading" id="cardHeading">Fill the form below</div>
      <form id="carbonForm">
        <div class="step active" data-panel="0">
          <div class="form-panel">
            <div class="row align-items-center g-2 mb-2"><label class="col-5 form-label" for="name">Name</label><div class="col-7"><input class="form-control" id="name" name="name" autocomplete="name" required></div></div>
            <div class="row align-items-center g-2 mb-2"><label class="col-5 form-label" for="age">Age</label><div class="col-7"><input class="form-control" id="age" name="age" type="number" min="1" max="120" required></div></div>
            <div class="row align-items-center g-2"><label class="col-5 form-label" for="country">Country</label><div class="col-7"><select class="form-select" id="country" name="country"><option>Saudi Arabia</option><option>United Arab Emirates</option><option>Egypt</option><option>United Kingdom</option><option>United States</option><option>Other</option></select></div></div>
          </div>
        </div>
        <div class="step" data-panel="1">
          <div class="form-panel">
            <div class="row align-items-center g-2 mb-3"><label class="col-6 form-label" for="electricity">Monthly electricity bill (SAR)</label><div class="col-6"><input class="form-control" type="number" id="electricity" min="0" value="300"></div></div>
            <div class="row align-items-center g-2"><label class="col-6 form-label" for="ac">Air conditioning use</label><div class="col-6"><select class="form-select" id="ac"><option value="3">Often</option><option value="2">Sometimes</option><option value="1">Rarely</option></select></div></div>
          </div>
        </div>
        <div class="step" data-panel="2">
          <div class="form-panel">
            <div class="row align-items-center g-2 mb-3"><label class="col-6 form-label" for="car">Car travel per week (km)</label><div class="col-6"><input class="form-control" type="number" id="car" min="0" value="100"></div></div>
            <div class="row align-items-center g-2"><label class="col-6 form-label" for="flights">Flights per year</label><div class="col-6"><input class="form-control" type="number" id="flights" min="0" value="1"></div></div>
          </div>
        </div>
        <div class="step" data-panel="3">
          <div class="form-panel">
            <div class="row align-items-center g-2 mb-3"><label class="col-6 form-label" for="diet">Usual diet</label><div class="col-6"><select class="form-select" id="diet"><option value="2.5">Mixed diet</option><option value="1.5">Mostly vegetarian</option><option value="1">Vegetarian</option><option value="0.8">Vegan</option></select></div></div>
            <div class="row align-items-center g-2"><label class="col-6 form-label" for="waste">Food waste</label><div class="col-6"><select class="form-select" id="waste"><option value="1.2">Sometimes</option><option value="1.5">Often</option><option value="0.8">Rarely</option></select></div></div>
          </div>
        </div>
        <div class="step" data-panel="4">
          <div class="form-panel">
            <div class="row align-items-center g-2 mb-3"><label class="col-6 form-label" for="screen">Daily screen time (hours)</label><div class="col-6"><input class="form-control" type="number" id="screen" min="0" max="24" value="5"></div></div>
            <div class="row align-items-center g-2"><label class="col-6 form-label" for="devices">Devices bought per year</label><div class="col-6"><input class="form-control" type="number" id="devices" min="0" value="1"></div></div>
          </div>
        </div>
        <div class="step" data-panel="5">
          <div class="form-panel">
            <div class="row align-items-center g-2 mb-3"><label class="col-6 form-label" for="clothes">Clothing items per month</label><div class="col-6"><input class="form-control" type="number" id="clothes" min="0" value="3"></div></div>
            <div class="row align-items-center g-2"><label class="col-6 form-label" for="recycle">Do you reuse or recycle?</label><div class="col-6"><select class="form-select" id="recycle"><option value="0.8">Usually</option><option value="1">Sometimes</option><option value="1.2">Rarely</option></select></div></div>
          </div>
        </div>
        <div class="step" data-panel="6">
          <div class="form-panel"><div class="result-box"><h2 class="h5">Your estimated footprint</h2><p class="mb-1"><strong id="resultValue">—</strong> kg CO₂e per year</p><p id="resultMessage" class="mb-0">Complete the form and select Calculate to see your estimate.</p></div><p class="mt-3 mb-0 small text-muted">This is a simplified educational estimate, not a formal measurement.</p></div>
        </div>
        <div class="footer">
          <button class="btn-green" type="button" id="prevBtn">Prev</button>
          <button class="btn-green" type="button" id="nextBtn">Next</button>
          <button class="btn-green d-none" type="button" id="calculateBtn">Calculate</button>
        </div>
      </form>
    </section>
    <p class="hint">Small everyday choices can help protect our planet.</p>
  </main>
  <script>
    (() => {
      const panels = [...document.querySelectorAll('.step')];
      const tabs = [...document.querySelectorAll('[data-step]')];
      const heading = document.getElementById('cardHeading');
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      const calc = document.getElementById('calculateBtn');
      const form = document.getElementById('carbonForm');
      let current = 0;
      const titles = ['Fill the form below','Home energy','Travel habits','Food choices','Electronic usage','Shopping habits','Your result'];
      function showStep(n) {
        current = Math.max(0, Math.min(6, n));
        panels.forEach((p,i)=>p.classList.toggle('active',i===current));
        tabs.forEach((t,i)=>{t.classList.toggle('active',i===current);t.setAttribute('aria-current',i===current?'step':'false')});
        heading.textContent = titles[current];
        prev.disabled = current===0;
        next.classList.toggle('d-none',current===6);
        calc.classList.toggle('d-none',current!==5);
        if(current===6){ next.classList.add('d-none'); calc.classList.add('d-none'); }
      }
      tabs.forEach(t=>t.addEventListener('click',()=>showStep(Number(t.dataset.step))));
      prev.addEventListener('click',()=>showStep(current-1));
      next.addEventListener('click',()=>{
        if(current===0 && !form.reportValidity()) return;
        showStep(current+1);
      });
      document.getElementById('homeLink').addEventListener('click',e=>{e.preventDefault();showStep(0)});
      calc.addEventListener('click',()=>{
        const num=id=>Math.max(0,Number(document.getElementById(id).value)||0);
        const electricity=num('electricity')*12*0.45;
        const travel=num('car')*52*0.21+num('flights')*250;
        const food=(Number(document.getElementById('diet').value)||2.5)*1000*(Number(document.getElementById('waste').value)||1);
        const electronics=num('screen')*365*0.08+num('devices')*120;
        const shopping=num('clothes')*12*8*(Number(document.getElementById('recycle').value)||1);
        const total=Math.round(electricity+travel+food+electronics+shopping);
        document.getElementById('resultValue').textContent=total.toLocaleString();
        document.getElementById('resultMessage').textContent=total<2500?'Your estimated footprint is relatively low. Keep up your eco-friendly habits!':total<5000?'There is room to reduce your footprint. Try saving energy and choosing greener travel.':'Consider reducing energy use, driving less, and buying only what you need.';
        showStep(6);
      });
      showStep(0);
    })();
  </script>
</body>
</html>
